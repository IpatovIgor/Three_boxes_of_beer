<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новая сессия</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<button class="menu-toggle" id="menuToggle" type="button" aria-label="Открыть меню">☰</button>

<nav class="menu" id="sideMenu" aria-label="Основная навигация">
    <ul>
        <li class="menu-item active" data-href="MainPage.html">На главную</li>
        <li class="menu-item" data-href="../sessions/Sessions.html">Сессии</li>
    </ul>
</nav>

<div class="menu-overlay" id="menuOverlay"></div>

<main class="page">
    <section class="session-card" aria-labelledby="session-title">
        <header class="workspace-header">
            <div class="workspace-nav" aria-label="Панель проекта">
                <span class="brand-mark">3B</span>
                <span class="workspace-name">Три ящика пива</span>
            </div>
            <div class="workspace-title">
                <div>
                    <p class="session-card__eyebrow">План подготовки</p>
                    <h1 id="session-title">Новая сессия</h1>
                    <p class="session-card__lead">Соберите тренировку как подборку задач: выберите направление, уровень и размер сета.</p>
                </div>
                <a class="history-link" href="../sessions/Sessions.html">История сессий</a>
            </div>
        </header>

        <div class="workspace-grid">
            <section class="panel">
                <form id="session-form" action="/create-session" method="POST">
                    <h2>Направление</h2>
                    <div class="div-group">
                        <label class="dir-option">
                            <input type="radio" name="direction" value="frontend" checked>
                            <span>Frontend</span>
                        </label>
                        <label class="dir-option">
                            <input type="radio" name="direction" value="backend">
                            <span>Backend</span>
                        </label>
                        <label class="dir-option">
                            <input type="radio" name="direction" value="fullstack">
                            <span>Fullstack</span>
                        </label>
                        <label class="dir-option">
                            <input type="radio" name="direction" value="data-science">
                            <span>Data Science</span>
                        </label>
                        <label class="dir-option">
                            <input type="radio" name="direction" value="devops">
                            <span>DevOps</span>
                        </label>
                    </div>

                    <h2>Сложность</h2>
                    <div class="level-group">
                        <label class="level-option">
                            <input type="radio" name="level" value="junior">
                            <span class="difficulty-easy">Junior</span>
                        </label>
                        <label class="level-option">
                            <input type="radio" name="level" value="middle">
                            <span class="difficulty-medium">Middle</span>
                        </label>
                        <label class="level-option">
                            <input type="radio" name="level" value="senior" checked>
                            <span class="difficulty-hard">Senior</span>
                        </label>
                    </div>

                    <h2>Количество вопросов</h2>
                    <div class="count-group">
                        <label class="count-option">
                            <input type="radio" name="count" value="5">
                            <span>5</span>
                        </label>
                        <label class="count-option">
                            <input type="radio" name="count" value="10" checked>
                            <span>10</span>
                        </label>
                        <label class="count-option">
                            <input type="radio" name="count" value="15">
                            <span>15</span>
                        </label>
                        <label class="count-option">
                            <input type="radio" name="count" value="20">
                            <span>20</span>
                        </label>
                    </div>

                    <button type="submit" class="primary-btn">Начать сессию</button>
                </form>
            </section>

            <aside class="progress-panel" aria-label="Статистика подготовки">
                <h2>Прогресс</h2>
                <section class="statistic">
                    <div class="stat-card session-count-stat">
                        <p class="num">20</p>
                        <p class="str">Сессий</p>
                    </div>
                    <div class="stat-card session-assessment-stat">
                        <p class="num">7.8</p>
                        <p class="str">Средняя оценка</p>
                    </div>
                    <div class="stat-card frequent-stat">
                        <p class="num">Frontend</p>
                        <p class="str">Основное направление</p>
                    </div>
                </section>
            </aside>
        </div>
    </section>
</main>
<script src="../shared/storage.js"></script>
<script src="session-start.js"></script>
</body>
</html>
