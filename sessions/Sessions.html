<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои сессии</title>
    <link rel="stylesheet" href="Sessions.css">
</head>
<body>
<button class="menu-toggle" id="menuToggle" type="button" aria-label="Открыть меню">☰</button>

<nav class="menu" id="sideMenu" aria-label="Основная навигация">
    <ul>
        <li class="menu-item" data-href="../main/MainPage.html">На главную</li>
        <li class="menu-item active" data-href="Sessions.html">Сессии</li>
    </ul>
</nav>

<div class="menu-overlay" id="menuOverlay"></div>

<main class="sessions-page">
    <section class="sessions-shell" aria-labelledby="sessions-title">
        <header class="sessions-header">
            <div class="sessions-nav">
                <span class="brand-mark">3B</span>
                <span class="workspace-name">Три ящика пива</span>
            </div>
            <div class="sessions-title-row">
                <div>
                    <p class="sessions-eyebrow">История подготовки</p>
                    <h1 id="sessions-title">Мои сессии</h1>
                    <p class="sessions-sub">Все завершённые тренировки на этом устройстве.</p>
                </div>
                <a class="new-session-link" href="../main/MainPage.html">Новая сессия</a>
            </div>
            <p class="sessions-device">ID устройства: <span id="device-id">—</span></p>
        </header>

        <section class="sessions-summary" id="sessions-summary"></section>

        <section class="sessions-list" id="sessions-list">
            <p class="sessions-empty">Ещё нет завершённых сессий.</p>
        </section>

        <section class="sessions-actions">
            <button id="clear-history" class="danger-btn">Очистить историю</button>
        </section>
    </section>
</main>

<script src="../shared/storage.js"></script>
<script src="Sessions.js"></script>
</body>
</html>
