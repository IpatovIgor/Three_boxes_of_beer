<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результаты сессии</title>
    <link rel="stylesheet" href="ResultPage.css">
</head>
<body>
<main>
    <button class="menu-toggle" id="menuToggle" type="button" aria-label="Открыть меню">☰</button>

    <nav class="menu" id="sideMenu" aria-label="Основная навигация">
        <ul>
            <li class="menu-item" data-href="../main/MainPage.html">На главную</li>
            <li class="menu-item" data-href="../sessions/Sessions.html">Сессии</li>
        </ul>
    </nav>

    <div class="result-panel">
        <header class="result-header">
            <div class="result-nav">
                <span class="brand-mark">3B</span>
                <span class="workspace-name">Три ящика пива</span>
            </div>
            <div class="result-title-row">
                <div>
                    <p class="result-eyebrow">Итог тренировки</p>
                    <h1>Результаты сессии</h1>
                    <p class="feedback-header">Frontend Senior завершено</p>
                </div>
                <a class="new-session-link" href="../main/MainPage.html">Новая сессия</a>
            </div>
        </header>

        <div class="stat-panel">
            <div class="stat">
                <p class="num">8.2</p>
                <p class="str">Средний балл</p>
            </div>
            <div class="stat">
                <p class="num">10</p>
                <p class="str">Вопросов</p>
            </div>
            <div class="stat">
                <p class="num">18 мин</p>
                <p class="str">Времени</p>
            </div>
        </div>

        <div class="wrang-panel">
            <h3>Слабые темы</h3>
            <div class="wrang">
                <p class="topek">Прототипное наследование</p>
                <p class="points">8/10</p>
            </div>

            <div class="wrang">
                <p class="topek">Замыкания в JavaScript</p>
                <p class="points">7/10</p>
            </div>

            <div class="wrang">
                <p class="topek">Event Loop</p>
                <p class="points">9/10</p>
            </div>
        </div>
    </div>

    <div class="menu-overlay" id="menuOverlay"></div>
</main>

<script src="../shared/storage.js"></script>
<script src="ResultPage.js"></script>
</body>
</html>
